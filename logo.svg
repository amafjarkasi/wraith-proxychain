             M-8,46 L-8,62 C-8,66 -12,70 -16,70 C-20,70 -22,66 -22,62 L-22,46
             M10,46 L10,62 C10,66 6,70 2,70 C-2,70 -4,66 -4,62 L-4,46
             M28,46 L28,58 C28,62 24,66 20,66 C16,66 14,62 14,58 L14,40"
          fill="url(#g)" opacity="0.92"/>
